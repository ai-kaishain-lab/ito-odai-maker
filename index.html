<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字で語れ！お題メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ef; --ink:#2b2320; --sub:#7a6a62; --card:#ffffff;
    --a:#ff6b4a; --b:#3d7bff; --line:#eadfd3; --chip:#f3e9de;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font-size:22px;font-weight:800;margin:0;letter-spacing:.02em}
  h1 span{color:var(--a)}
  .note{font-size:11px;color:var(--sub)}
  .tabs{display:flex;background:var(--chip);border-radius:999px;padding:4px;margin:16px 0}
  .tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:999px;
    font:inherit;font-weight:800;color:var(--sub);cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 12px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer}
  .chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .card{background:var(--card);border-radius:22px;padding:26px 20px 22px;
    box-shadow:0 6px 24px rgba(80,40,20,.08);text-align:center;position:relative;overflow:hidden}
  .tag{display:inline-block;font-size:11px;font-weight:800;color:var(--a);
    background:#fff0eb;border-radius:999px;padding:3px 10px;margin-bottom:12px}
  .topic{font-size:28px;font-weight:800;line-height:1.35;min-height:76px;
    display:flex;align-items:center;justify-content:center;word-break:auto-phrase}
  .topic.pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
  .scale{margin-top:18px}
  .bar{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--b),#b9a4ff,var(--a))}
  .ends{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;text-align:left}
  .ends div:last-child{text-align:right}
  .ends b{display:block;font-size:18px}
  .ends .lo b{color:var(--b)} .ends .hi b{color:var(--a)}
  .ends span{color:var(--sub)}
  .row{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800;
    font-size:16px;cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .main{background:var(--a);color:#fff;box-shadow:0 4px 0 #d4502f}
  .ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto}
  .small{font-size:13px;padding:12px 14px}
  .hist{margin-top:22px}
  .hist h3{font-size:13px;color:var(--sub);margin:0 0 8px}
  .hist li{list-style:none;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line);
    display:flex;justify-content:space-between;gap:8px}
  .hist ul{padding:0;margin:0}
  .hist li span{color:var(--sub);font-size:11px;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
    transition:transform .25s;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0)}
  /* deal */
  .stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px}
  .stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--card);font:inherit;font-size:22px;font-weight:800;cursor:pointer}
  .stepper .n{font-size:30px;font-weight:800;min-width:90px;text-align:center}
  .stepper .n small{font-size:13px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:16px}
  .pc{aspect-ratio:3/4;border-radius:16px;border:0;font:inherit;cursor:pointer;
    background:repeating-linear-gradient(45deg,#2b2320 0 10px,#3a302c 10px 20px);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 4px 0 #120d0b}
  .pc .who{font-size:12px;opacity:.8}
  .pc .num{font-size:40px;font-weight:800}
  .pc.open{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
  .pc.open .num{background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;color:transparent}
  .help{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.7}
  .result{margin-top:16px;background:var(--card);border-radius:16px;padding:14px;font-size:14px;line-height:1.9}
  .hidden{display:none}
  .mini{font-size:13px;color:var(--sub);text-align:center;margin-bottom:6px}
  .mini b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>数字で語れ！<span>お題メーカー</span></h1>
    <div class="note">ito向け非公式ツール</div>
  </header>

  <div class="tabs">
    <button class="on" data-tab="topic">お題をつくる</button>
    <button data-tab="deal">数字を配る</button>
  </div>

  <!-- TOPIC -->
  <section id="topic">
    <div class="chips" id="cats"></div>
    <div class="card">
      <div class="tag" id="tag">定番</div>
      <div class="topic" id="topicText">ボタンを押してね</div>
      <div class="scale">
        <div class="bar"></div>
        <div class="ends">
          <div class="lo"><b>1</b><span id="lo">—</span></div>
          <div class="hi"><b>100</b><span id="hi">—</span></div>
        </div>
      </div>
    </div>
    <div class="row">
      <button class="btn main" id="next">次のお題 ▶</button>
      <button class="btn ghost small" id="copy">コピー</button>
    </div>
    <div class="hist">
      <h3>このゲームで出たお題</h3>
      <ul id="hist"></ul>
    </div>
  </section>

  <!-- DEAL -->
  <section id="deal" class="hidden">
    <div class="mini">いまのお題：<b id="curTopic">（まだありません）</b></div>
    <div class="stepper">
      <button id="minus">−</button>
      <div class="n"><span id="pn">4</span><small> 人</small></div>
      <button id="plus">＋</button>
    </div>
    <div class="row" style="margin-top:0">
      <button class="btn main" id="dealBtn">1〜100を配る</button>
      <button class="btn ghost small" id="reveal">答え合わせ</button>
    </div>
    <div class="help">スマホを順番に回して、自分のカードだけタップして確認 → もう一度タップで隠す。<br>全員が出し終わったら「答え合わせ」。</div>
    <div class="grid" id="grid"></div>
    <div class="result hidden" id="result"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 厳選お題（オリジナル） [お題, 1側, 100側] ===== */
const CURATED = {
  "定番": [
    ["動物の強さ","弱そう","最強"],["人気の食べ物","不人気","みんな大好き"],
    ["もらってうれしいプレゼント","微妙…","最高にうれしい"],["こわいもの","ぜんぜん平気","絶対ムリ"],
    ["行ってみたい旅行先","別に…","今すぐ行きたい"],["大きいもの","ちっちゃい","超でかい"],
    ["かっこいい職業","地味","憧れる"],["休日の過ごし方の充実度","ダラダラ","最高の1日"],
    ["朝起きてうれしいこと","ちょっと","飛び起きる"],["テンションが上がる音","無反応","アガる！"],
    ["子どもに人気のもの","見向きもされない","大人気"],["値段が高そうなもの","激安","超高級"],
    ["重いもの","軽い","めっちゃ重い"],["長生きしそうなもの","すぐ終わる","永遠"],
    ["夏っぽいもの","冬っぽい","THE夏"],["痛いもの","ぜんぜん","激痛"],
  ],
  "食べ物": [
    ["コンビニで買いたいもの","スルー","絶対買う"],["夜中に食べたくなるもの","我慢できる","抗えない"],
    ["ご飯がすすむおかず","すすまない","無限にいける"],["辛そうな食べ物","甘口","激辛"],
    ["お祭りの屋台で並びたいもの","並ばない","長蛇の列でも"],["給食の人気メニュー","残される","争奪戦"],
    ["朝ごはんにうれしいもの","いらない","最高の朝"],["高級そうな食べ物","庶民派","セレブ"],
    ["サウナ後に食べたいもの","いらない","至福"],["においが強い食べ物","無臭","強烈"],
    ["お弁当に入ってたらうれしいもの","がっかり","当たり！"],["鍋に入れたい具","いらない","主役"],
  ],
  "会社員あるある": [
    ["上司に言われてうれしい一言","ふつう","泣ける"],["会議で言われたら焦る一言","平気","冷や汗"],
    ["月曜日のつらさ","余裕","布団から出られない"],["定時で帰れたときの気分","ふつう","優勝"],
    ["飲み会で盛り上がる話題","すべる","大盛り上がり"],["ありがたい福利厚生","いらない","神制度"],
    ["仕事中にやりがちなサボり","ほぼしない","常習"],["通勤中のストレス","快適","限界"],
    ["有給の使い道の満足度","もったいない","大正解"],["もらってうれしい差し入れ","微妙","神"],
    ["言われたくない口ぐせ","気にならない","イラッ"],["社内イベントの楽しさ","帰りたい","毎年楽しみ"],
  ],
  "AI・テック": [
    ["AIに任せたい家事","自分でやる","全部任せたい"],["便利な家電","なくても平気","ないと生きられない"],
    ["未来にありそうな発明","ありえない","10年後には当たり前"],["AIに頼んだら怖いこと","安心","絶対ダメ"],
    ["スマホがないと困る場面","困らない","詰む"],["ロボットにしてほしいこと","別に","今すぐ頼む"],
    ["バズりそうな動画ネタ","伸びない","100万再生"],["使ってて楽しいアプリ","すぐ消す","毎日開く"],
    ["AIに相談したいこと","人に聞く","AI一択"],["電池が切れたら困るもの","平気","絶望"],
  ],
  "想像力": [
    ["無人島に持っていきたいもの","不要","命綱"],["ゾンビ世界で役立つもの","足手まとい","最強装備"],
    ["魔法が使えたらやりたいこと","しょぼい","世界が変わる"],["宇宙人に見せたい地球のもの","恥ずかしい","誇らしい"],
    ["タイムマシンで行きたい時代","行きたくない","今すぐ"],["透明人間になったらしたいこと","地味","大胆"],
    ["ヒーローの必殺技の強さ","弱い","最強"],["もしも猫になったらしたいこと","ふつう","猫の特権"],
    ["異世界に転生したときの当たり職業","ハズレ","大当たり"],["100万円もらったら使い道の満足度","後悔","大満足"],
  ],
  "人間関係": [
    ["友だちに言われてうれしい一言","ふつう","一生覚えてる"],["初対面で盛り上がる話題","沈黙","意気投合"],
    ["デートで行きたい場所","気まずい","最高"],["気まずい瞬間","平気","消えたい"],
    ["親に感謝していること","まあまあ","頭が上がらない"],["モテそうな特技","モテない","モテモテ"],
    ["ほめられてうれしいところ","ふつう","照れる"],["ゆるせないマナー違反","気にしない","絶対ゆるせない"],
  ],
};

/* ===== ミックス：場面 × ものさし ===== */
const SCENES = ["コンビニで買えるもの","会社にあるもの","100円で買えるもの","動物","スマホアプリ",
  "休日の過ごし方","家電","スポーツ","お祭りの屋台","冬に食べたいもの","旅行先","子どもの頃の遊び",
  "飲み会での一言","誕生日プレゼント","スイーツ","乗り物","ゲームのキャラ","学校行事","朝の習慣","サウナでの過ごし方",
  "日本の名物","映画のジャンル","部屋に置きたいもの","SNSの投稿"];
const AXES = [
  ["人気","人気ない","大人気"],["強さ","よわよわ","最強"],["大きさ","ちっちゃい","でかい"],
  ["値段の高さ","激安","高級"],["うれしさ","ふつう","最高"],["テンションの上がり具合","無","爆上がり"],
  ["大人っぽさ","子どもっぽい","大人"],["危なさ","安全","危険"],["モテそう度","モテない","モテる"],
  ["レア度","よくある","激レア"],["疲れが取れる度","逆に疲れる","全回復"],["映え度","映えない","超映え"],
  ["100年後も残っていそう度","すぐ消える","永遠"],["面倒くささ","ラク","超面倒"],["背徳感","健全","罪深い"],
  ["かっこよさ","ダサい","かっこいい"],["安心感","不安","安心"],["バズりそう度","伸びない","大バズ"],
  ["高級感","チープ","ラグジュアリー"],["うるささ","静か","うるさい"],["昭和っぽさ","令和","昭和"],
  ["外国人にウケそう度","ウケない","大ウケ"],
];

const CATS = ["ぜんぶ", ...Object.keys(CURATED), "ミックス"];
let cat = "ぜんぶ", current = null, history = [], used = new Set();
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];

function mixTopic(){
  const s = pick(SCENES), a = pick(AXES);
  return {text:`${s}の${a[0]}`, lo:a[1], hi:a[2], tag:"ミックス"};
}
function curatedTopic(c){
  const t = pick(CURATED[c]); return {text:t[0], lo:t[1], hi:t[2], tag:c};
}
function genTopic(){
  for(let i=0;i<40;i++){
    let t;
    if(cat==="ミックス") t = mixTopic();
    else if(cat==="ぜんぶ") t = Math.random()<0.3 ? mixTopic() : curatedTopic(pick(Object.keys(CURATED)));
    else t = curatedTopic(cat);
    if(!used.has(t.text)){ used.add(t.text); return t; }
  }
  used.clear(); return genTopic();
}
function show(t){
  current = t;
  const el = $("topicText");
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  el.textContent = t.text; $("tag").textContent = t.tag;
  $("lo").textContent = t.lo; $("hi").textContent = t.hi;
  $("curTopic").textContent = t.text;
  history.unshift(t); history = history.slice(0,8);
  $("hist").innerHTML = history.map(h=>`<li>${h.text}<span>${h.tag}</span></li>`).join("");
}
function renderCats(){
  $("cats").innerHTML = CATS.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join("");
}
$("cats").addEventListener("click",e=>{
  const c = e.target.dataset.c; if(!c) return; cat = c; renderCats(); show(genTopic());
});
$("next").onclick = ()=>show(genTopic());

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
$("copy").onclick = async ()=>{
  if(!current) return;
  const s = `お題：${current.text}\n1＝${current.lo} ／ 100＝${current.hi}`;
  try{ await navigator.clipboard.writeText(s); toast("コピーしました"); }
  catch(e){ toast("コピーできませんでした"); }
};

/* tabs */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("topic").classList.toggle("hidden", b.dataset.tab!=="topic");
  $("deal").classList.toggle("hidden", b.dataset.tab!=="deal");
});

/* deal */
let pn = 4, hands = [];
$("minus").onclick=()=>{ pn=Math.max(2,pn-1); $("pn").textContent=pn; };
$("plus").onclick=()=>{ pn=Math.min(10,pn+1); $("pn").textContent=pn; };
function deal(){
  const pool = Array.from({length:100},(_,i)=>i+1);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  hands = pool.slice(0,pn);
  $("result").classList.add("hidden");
  $("grid").innerHTML = hands.map((n,i)=>
    `<button class="pc" data-i="${i}"><span class="who">プレイヤー${i+1}</span><span class="num">?</span></button>`).join("");
}
$("dealBtn").onclick = deal;
$("grid").addEventListener("click",e=>{
  const b = e.target.closest(".pc"); if(!b) return;
  const open = b.classList.toggle("open");
  b.querySelector(".num").textContent = open ? hands[b.dataset.i] : "?";
});
$("reveal").onclick=()=>{
  if(!hands.length) return;
  document.querySelectorAll(".pc").forEach(b=>{ b.classList.add("open"); b.querySelector(".num").textContent=hands[b.dataset.i]; });
  const order = hands.map((n,i)=>({n,i})).sort((a,b)=>a.n-b.n);
  $("result").innerHTML = "<b>小さい順</b><br>"+order.map(o=>`プレイヤー${o.i+1}：${o.n}`).join("<br>");
  $("result").classList.remove("hidden");
};

renderCats(); show(genTopic()); deal();
</script>
</body>
</html>
